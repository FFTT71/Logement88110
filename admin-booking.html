<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration des Réservations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        .header h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 16px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-number {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .stat-label {
            color: #666;
            font-size: 16px;
            font-weight: 600;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
        }
        
        .filter-group label {
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }
        
        .filter-group select,
        .filter-group input {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .table-container {
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }
        
        th {
            background: #667eea;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }
        
        tr:hover {
            background: #f5f5f5;
        }
        
        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }
        
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-confirmed {
            background: #d4edda;
            color: #155724;
        }
        
        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            margin: 2px;
        }
        
        .btn-confirm {
            background: #28a745;
            color: white;
        }
        
        .btn-confirm:hover {
            background: #218838;
        }
        
        .btn-cancel {
            background: #dc3545;
            color: white;
        }
        
        .btn-cancel:hover {
            background: #c82333;
        }
        
        .btn-email {
            background: #007bff;
            color: white;
        }
        
        .btn-email:hover {
            background: #0056b3;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            z-index: 1000;
            display: none;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .notification.success {
            background: #28a745;
            color: white;
        }
        
        .notification.error {
            background: #dc3545;
            color: white;
        }
        
        @media (max-width: 768px) {
            .stats {
                grid-template-columns: 1fr;
            }
            
            .filters {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏠 Administration des Réservations</h1>
            <p>La maison du Nid Vosgien</p>
        </div>
        
        <div id="errorMessage" class="error" style="display: none;"></div>
        <div id="successMessage" class="success" style="display: none;"></div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="pendingCount">0</div>
                <div class="stat-label">En attente</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="confirmedCount">0</div>
                <div class="stat-label">Confirmées</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="upcomingCount">0</div>
                <div class="stat-label">À venir</div>
            </div>
        </div>
        
        <div class="card">
            <h2>📋 Liste des réservations</h2>
            
            <div class="filters">
                <div class="filter-group">
                    <label>Statut</label>
                    <select id="statusFilter" onchange="filterBookings()">
                        <option value="all">Tous</option>
                        <option value="pending">En attente</option>
                        <option value="confirmed">Confirmées</option>
                        <option value="cancelled">Annulées</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label>Recherche</label>
                    <input type="text" id="searchInput" placeholder="Nom, email..." onkeyup="filterBookings()">
                </div>
            </div>
            
            <div id="loadingMessage" class="loading">
                <p>⏳ Chargement des réservations...</p>
            </div>
            
            <div class="table-container" id="tableContainer" style="display: none;">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Client</th>
                            <th>Contact</th>
                            <th>Dates</th>
                            <th>Personnes</th>
                            <th>Prix</th>
                            <th>Statut</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="bookingsTable">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div id="notification" class="notification"></div>
    
    <script>
        // API URL
        const API_URL = 'https://script.google.com/macros/s/AKfycbzx8ZZd17DX9rb1kqhXdUZjQD62uH6G0pY-tsPclwRVeMq5j6C2kV9JPaK8rMLZPzuhUw/exec';
        
        let allBookings = [];
        
        // Beim Laden der Seite
        window.addEventListener('DOMContentLoaded', function() {
            console.log('Admin panel loading...');
            loadBookings();
        });
        
        // Buchungen laden
        async function loadBookings() {
            try {
                console.log('Loading bookings from:', API_URL);
                
                showLoading(true);
                hideError();
                
                const response = await fetch(`${API_URL}?action=getBookings&timestamp=${Date.now()}`);
                
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const text = await response.text();
                console.log('Response text:', text.substring(0, 200));
                
                let bookings;
                try {
                    bookings = JSON.parse(text);
                } catch (e) {
                    console.error('JSON parse error:', e);
                    throw new Error('Réponse invalide du serveur');
                }
                
                console.log('Bookings loaded:', bookings.length);
                
                if (!Array.isArray(bookings)) {
                    console.error('Bookings is not an array:', bookings);
                    bookings = [];
                }
                
                allBookings = bookings;
                displayBookings(bookings);
                updateStats(bookings);
                
                showLoading(false);
                document.getElementById('tableContainer').style.display = 'block';
                
            } catch (error) {
                console.error('Error loading bookings:', error);
                showError('Erreur lors de la mise à jour: ' + error.message);
                showLoading(false);
            }
        }
        
        // Buchungen anzeigen
        function displayBookings(bookings) {
            const tbody = document.getElementById('bookingsTable');
            tbody.innerHTML = '';
            
            if (bookings.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px; color: #999;">Aucune réservation trouvée</td></tr>';
                return;
            }
            
            bookings.forEach(booking => {
                const row = document.createElement('tr');
                
                const statusClass = booking.status === 'confirmed' ? 'status-confirmed' : 
                                   booking.status === 'cancelled' ? 'status-cancelled' : 
                                   'status-pending';
                
                const statusText = booking.status === 'confirmed' ? 'Confirmée' : 
                                  booking.status === 'cancelled' ? 'Annulée' : 
                                  'En attente';
                
                const guestsDetail = booking.guestsDetail || `${booking.numGuests} personne(s)`;
                
                row.innerHTML = `
                    <td><small>${String(booking.id).substring(0, 8)}...</small></td>
                    <td><strong>${booking.guestName || 'N/A'}</strong></td>
                    <td>
                        📧 ${booking.email || 'N/A'}<br>
                        📱 ${booking.phone || 'N/A'}
                    </td>
                    <td>
                        📅 ${formatDate(booking.arrivalDate)}<br>
                        📅 ${formatDate(booking.departureDate)}<br>
                        🌙 ${booking.numNights || 0} nuit(s)
                    </td>
                    <td>👥 ${guestsDetail}</td>
                    <td><strong>${booking.totalPrice || 0}€</strong></td>
                    <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                    <td>
                        ${booking.status === 'pending' ? `
                            <button class="btn btn-confirm" onclick="confirmBooking('${booking.id}')">✓ Confirmer</button>
                        ` : ''}
                        ${booking.status !== 'cancelled' ? `
                            <button class="btn btn-cancel" onclick="cancelBooking('${booking.id}')">✕ Annuler</button>
                        ` : ''}
                        <button class="btn btn-email" onclick="sendEmail('${booking.id}')">✉ Email</button>
                    </td>
                `;
                
                tbody.appendChild(row);
            });
        }
        
        // Statistiken aktualisieren
        function updateStats(bookings) {
            const pending = bookings.filter(b => b.status === 'pending').length;
            const confirmed = bookings.filter(b => b.status === 'confirmed').length;
            
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            const upcoming = bookings.filter(b => {
                if (b.status !== 'confirmed') return false;
                const arrivalDate = new Date(b.arrivalDate);
                return arrivalDate >= today;
            }).length;
            
            document.getElementById('pendingCount').textContent = pending;
            document.getElementById('confirmedCount').textContent = confirmed;
            document.getElementById('upcomingCount').textContent = upcoming;
        }
        
        // Buchungen filtern
        function filterBookings() {
            const statusFilter = document.getElementById('statusFilter').value;
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = allBookings;
            
            if (statusFilter !== 'all') {
                filtered = filtered.filter(b => b.status === statusFilter);
            }
            
            if (searchText) {
                filtered = filtered.filter(b => 
                    (b.guestName && b.guestName.toLowerCase().includes(searchText)) ||
                    (b.email && b.email.toLowerCase().includes(searchText)) ||
                    (b.phone && b.phone.includes(searchText))
                );
            }
            
            displayBookings(filtered);
        }
        
        // Buchung bestätigen
        async function confirmBooking(id) {
            if (!confirm('Voulez-vous confirmer cette réservation ?')) {
                return;
            }
            
            try {
                showLoading(true);
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'updateBookingStatus',
                        bookingId: id,
                        status: 'confirmed'
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showNotification('Réservation confirmée !', 'success');
                    await loadBookings();
                } else {
                    showNotification('Erreur : ' + (result.message || 'Erreur inconnue'), 'error');
                }
                
            } catch (error) {
                console.error('Error:', error);
                showNotification('Erreur : ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }
        
        // Buchung stornieren
        async function cancelBooking(id) {
            if (!confirm('Voulez-vous vraiment annuler cette réservation ?\n\nUn email d\'annulation sera envoyé au client.')) {
                return;
            }
            
            const reason = prompt(
                'Motif de l\'annulation :',
                'L\'acompte n\'a pas été reçu dans les délais impartis.'
            );
            
            if (!reason) {
                showNotification('Annulation abandonnée', 'error');
                return;
            }
            
            try {
                showLoading(true);
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'cancelBooking',
                        bookingId: id,
                        reason: reason
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showNotification('Réservation annulée et email envoyé !', 'success');
                    await loadBookings();
                } else {
                    showNotification('Erreur : ' + (result.message || 'Erreur inconnue'), 'error');
                }
                
            } catch (error) {
                console.error('Error:', error);
                showNotification('Erreur : ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }
        
        // Email senden
        async function sendEmail(id) {
            const booking = allBookings.find(b => b.id == id);
            if (!booking) {
                showNotification('Réservation introuvable', 'error');
                return;
            }
            
            const emailType = prompt(
                'Type d\'email à envoyer :\n\n' +
                '1. Confirmation\n' +
                '2. Rappel de paiement\n' +
                '3. Information générale\n\n' +
                'Entrez le numéro (1-3) :',
                '1'
            );
            
            if (!emailType) return;
            
            showNotification('Fonctionnalité en développement', 'error');
        }
        
        // Hilfsfunktionen
        function formatDate(dateStr) {
            if (!dateStr) return 'N/A';
            
            try {
                const date = new Date(dateStr);
                const options = { 
                    day: '2-digit', 
                    month: '2-digit', 
                    year: 'numeric' 
                };
                return date.toLocaleDateString('fr-FR', options);
            } catch (e) {
                return dateStr;
            }
        }
        
        function showLoading(show) {
            document.getElementById('loadingMessage').style.display = show ? 'block' : 'none';
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
        
        function hideError() {
            document.getElementById('errorMessage').style.display = 'none';
        }
        
        function showNotification(message, type) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type}`;
            notification.style.display = 'block';
            
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
